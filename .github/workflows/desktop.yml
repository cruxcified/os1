name: Desktop app

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  package:
    name: Installer (${{ matrix.name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Mac
            os: macos-latest
            script: dist:mac
            files: release/*.dmg
          - name: Windows
            os: windows-latest
            script: dist:win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      # Unsigned builds: don't look for a signing certificate.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }} -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: OS1-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 14
